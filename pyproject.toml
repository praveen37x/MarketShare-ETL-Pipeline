[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketshare-etl-pipeline"
version = "1.0.0"
description = "Institutional-Grade Global IT Services & Cloud Market Share ETL Pipeline (2019-2024) using Polars, DuckDB, SQLite, and Streamlit"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Praveen Tripathi", email = "praveen@straddleedge.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
